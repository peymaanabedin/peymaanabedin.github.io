<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5"><meta name="robots" content="noindex"><title>به‌روزرسانی نشانا</title>
<style>
@font-face{font-family:Peyda;src:url('./assets/fonts/Peyda-Regular.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f7f8f5;color:#223746;font-family:Peyda,system-ui,sans-serif;padding:24px;line-height:1.9}main{width:min(100%,400px);text-align:center}img{border-radius:24px}h1{font-size:24px;margin:22px 0 8px}p{font-size:15px;color:#5b6a75}#repairStatus{min-height:58px}button,a{display:block;width:100%;padding:14px;margin:12px 0;border:0;border-radius:16px;font:inherit;text-decoration:none;background:#285ef0;color:white;cursor:pointer}a{background:#e8eefc;color:#2851bf}small{display:block;margin-top:22px;color:#687580}[hidden]{display:none!important}
</style>
<script src="./repair.js" defer></script>
</head>
<body><main><img src="./assets/icons/icon-192.png" width="80" height="80" alt="نشانا"><h1>نشانا را تازه کنیم.</h1><p>اصلاحیهٔ برنامه دریافت می‌شود.<br>مکان‌ها، عکس‌ها و نقشهٔ ذخیره‌شده حفظ می‌شوند.</p><p id="repairStatus" role="status" aria-live="polite">در حال دریافت نسخهٔ تازه…</p><button id="repairRetry" hidden>تلاش دوباره</button><a id="repairOpen" href="./" hidden>باز کردن نشانا</a><small>برای دریافت اصلاحیه، اینترنت را روشن و این صفحه را باز نگه دار.</small></main></body>
</html>
